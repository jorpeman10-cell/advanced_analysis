[gllue_db]
host = "127.0.0.1"
port = 3306
database = "gllue"
username = "your_db_user"
password = "your_db_password"
use_ssh = true
ssh_host = "your_ssh_host"
ssh_port = 22
ssh_user = "your_ssh_user"
ssh_password = "your_ssh_password"

# Option A: simple name-to-monthly-salary mapping.
[consultant_salaries]
"Lucy Wang" = 15000
"Vivien Zhao" = 19000

# Option B: if you prefer rows, use this format instead of Option A.
# [[consultant_salaries.salaries]]
# consultant = "Lucy Wang"
# base_salary = 15000
#
# [[consultant_salaries.salaries]]
# consultant = "Vivien Zhao"
# base_salary = 19000
